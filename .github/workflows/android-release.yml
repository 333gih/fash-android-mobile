# Bundle signed prod AAB (.aab) and upload to Google Play.
# Push release/** or releases/** → upload track alpha (Closed testing in Play Console).
# Requires upload keystore + Play Console service account (see docs/CI.md).
#
# Triggers:
#   - Push releases/** or release/** : bundle + Play upload → closed testing (alpha)
#   - Push main/master or tag android/v* : bundle + artifact only (no Play upload)
#   - Manual: Actions → Android Release → Run workflow
name: Android Release

on:
  workflow_dispatch:
    inputs:
      upload_play:
        description: Upload AAB to Google Play (prod)
        required: false
        default: true
        type: boolean
      play_track:
        description: Play track (alpha = Closed testing, beta = Open testing)
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - internal
          - beta
          - production
  push:
    branches:
      - main
      - master
      - "release/**"
      - "releases/**"
    tags:
      - "android/v*"

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bundle & upload AAB
    runs-on: ubuntu-latest
    env:
      UPLOAD_PLAY: >-
        ${{
          (github.event_name == 'workflow_dispatch' && inputs.upload_play) ||
          (github.event_name == 'push' && (
            startsWith(github.ref, 'refs/heads/releases/') ||
            startsWith(github.ref, 'refs/heads/release/')
          ))
        }}
      PLAY_TRACK: >-
        ${{
          github.event_name == 'workflow_dispatch' && inputs.play_track ||
          (github.event_name == 'push' && (
            startsWith(github.ref, 'refs/heads/releases/') ||
            startsWith(github.ref, 'refs/heads/release/')
          ) && 'alpha') ||
          'internal'
        }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify release secrets
        env:
          DEV_ENV: ${{ secrets.ANDROID_DEV_ENV }}
          PROD_ENV: ${{ secrets.ANDROID_PROD_ENV }}
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in DEV_ENV PROD_ENV KEYSTORE_B64 STORE_PW KEY_ALIAS KEY_PW; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing GitHub secret for ${name}. See docs/CI.md § Play release."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Verify Google Play secrets
        if: env.UPLOAD_PLAY == 'true'
        env:
          PLAY_SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${PLAY_SA:-}" ]]; then
            echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON. See docs/CI.md § Play Console API."
            exit 1
          fi

      - name: Write env files
        env:
          DEV_ENV: ${{ secrets.ANDROID_DEV_ENV }}
          PROD_ENV: ${{ secrets.ANDROID_PROD_ENV }}
        run: |
          set -euo pipefail
          mkdir -p env
          printf '%s\n' "${DEV_ENV}" > env/dev.env
          printf '%s\n' "${PROD_ENV}" > env/prod.env

      - name: Prepare release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: bash scripts/ci_prepare_release_signing.sh

      - name: Read app version
        id: app_version
        run: |
          set -euo pipefail
          VC="$(grep 'versionCode' app/build.gradle.kts | head -1 | sed -E 's/.*= ([0-9]+).*/\1/')"
          VN="$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*= "([^"]+)".*/\1/')"
          echo "version_code=${VC}" >> "${GITHUB_OUTPUT}"
          echo "version_name=${VN}" >> "${GITHUB_OUTPUT}"
          echo "Release target: ${VN} (${VC})"

      - name: Bundle prodRelease AAB
        id: bundle
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:bundleProdRelease --stacktrace | tee gradle-bundle.log

      - name: Locate AAB and mapping
        id: artifacts
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/prodRelease -name '*.aab' | head -1)"
          test -n "${AAB}" && test -f "${AAB}"
          echo "aab_path=${AAB}" >> "${GITHUB_OUTPUT}"
          ls -la "${AAB}"
          MAPPING="app/build/outputs/mapping/prodRelease/mapping.txt"
          if [[ -f "${MAPPING}" ]]; then
            echo "mapping_path=${MAPPING}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: fash-android-prod-aab-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/prodRelease/*.aab
            app/build/outputs/mapping/prodRelease/mapping.txt
          retention-days: 30
          if-no-files-found: error

      - name: Upload to Google Play
        id: upload-play
        if: env.UPLOAD_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pc.fash_android_mobile
          releaseFiles: ${{ steps.artifacts.outputs.aab_path }}
          track: ${{ env.PLAY_TRACK }}
          status: completed
          mappingFile: ${{ steps.artifacts.outputs.mapping_path }}

      - name: Release summary
        if: always() && steps.app_version.outcome == 'success'
        env:
          UPLOAD_PLAY: ${{ env.UPLOAD_PLAY }}
          UPLOAD_OUTCOME: ${{ steps.upload-play.outcome }}
          PLAY_TRACK: ${{ env.PLAY_TRACK }}
        run: |
          echo "### Android release" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Version: **${{ steps.app_version.outputs.version_name }} (${{ steps.app_version.outputs.version_code }})**" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Event: **${{ github.event_name }}** · Ref: \`${{ github.ref }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "- Bundle: **${{ steps.bundle.outcome }}**" >> "${GITHUB_STEP_SUMMARY}"
          if [[ "${UPLOAD_PLAY}" == "true" ]]; then
            echo "- Play upload (track **${PLAY_TRACK}**): **${UPLOAD_OUTCOME}**" >> "${GITHUB_STEP_SUMMARY}"
            if [[ "${UPLOAD_OUTCOME}" == "success" ]]; then
              echo "- Play Console → **${{ steps.app_version.outputs.version_name }}** (review/processing may take a few minutes)" >> "${GITHUB_STEP_SUMMARY}"
            fi
          else
            echo "- AAB artifact only (Play upload skipped for this trigger)" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fash-android-release-logs-${{ github.run_number }}
          path: gradle-bundle.log
          retention-days: 14
          if-no-files-found: ignore
